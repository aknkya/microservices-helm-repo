replicaCount: 3

image:
  repository: ghcr.io/aknkya/notification-service
  pullPolicy: IfNotPresent
  tag: "v1.0.2"

service:
  type: ClusterIP
  port: 8082

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

probes:
  liveness:
    path: /actuator/health
    initialDelaySeconds: 40
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /actuator/health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

config:
  appEnvironment: "production"

route:
  enabled: false
